name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.8 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x64'
          cache: 'pip'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==5.13.2

      - name: Download face recognition models and assets
        run: python download_models.py

      - name: Check models and assets
        shell: pwsh
        run: |
          Write-Host "=== MODELS ==="
          if (Test-Path "models") {
            Get-ChildItem models -Recurse
          } else {
            throw "models folder was not created"
          }

          Write-Host "=== ASSETS ==="
          if (Test-Path "assets") {
            Get-ChildItem assets -Recurse
          } else {
            Write-Host "assets folder not found"
          }

      - name: Build PhotoArchiveCatalog EXE
        shell: cmd
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name PhotoArchiveCatalog
          --add-data "models;models"
          --add-data "assets;assets"
          --hidden-import cv2
          --hidden-import numpy
          --hidden-import openpyxl
          --hidden-import docx
          --hidden-import pyodbc
          --hidden-import PIL
          --hidden-import PIL.Image
          --hidden-import PIL.ImageTk
          --collect-all openpyxl
          --collect-all docx
          main.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (!(Test-Path "dist/PhotoArchiveCatalog.exe")) {
            throw "PhotoArchiveCatalog.exe was not created"
          }

          $file = Get-Item "dist/PhotoArchiveCatalog.exe"

          Write-Host "================================="
          Write-Host "EXE successfully created"
          Write-Host "File: $($file.FullName)"
          Write-Host "Size: $([math]::Round($file.Length / 1MB, 2)) MB"
          Write-Host "================================="

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: PhotoArchiveCatalog-Katalog5-Windows
          path: dist/PhotoArchiveCatalog.exe
          if-no-files-found: error
          retention-days: 30
